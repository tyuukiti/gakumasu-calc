# H.I.F カスタムPアイテム（ポーチ）定義
#
# 選抜試験①突破で入手（段階0=未カスタマイズ）、②突破で1段階目（ぬいぐるみ）、③突破で2段階目（デコレーション）に
# カスタマイズされる。各段階は有効期間（stage_windows）内で trigger に合う日程を踏んだときに発動し、
# effects の回数（キーは AdditionalCounts と同じ trigger 名）を追加イベント回数に加算する。
#
#   trigger: lesson_end（公開レッスン終了時）/ consultation（相談選択時）/ activity_supply（差し入れ終了時）/ outing_end（おでかけ終了時）
#   max_count: プロデュース中の発動回数上限（段階ごと）
#   effects:   1回の発動で追加する回数。Pポイント・割引・体力回復・共通効果は計算対象外のため description にのみ記載
#
# 出典: 学マスwiki H.I.F「カスタムPアイテム」。「高確率でSSR」「コピー（獲得扱い）」は理論値として SSR獲得に数える。
hif_pouch:
  stage_windows:
    - { stage: 0, from_week: 8,  to_week: 12 }   # 選抜①(7)突破後〜選抜②(13)前
    - { stage: 1, from_week: 14, to_week: 19 }   # 選抜②突破後〜選抜③(20)前
    - { stage: 2, from_week: 21, to_week: 26 }   # 選抜③突破後〜本戦6日目（インターバルは相談指定効果が発動しない）
  colors:
    # ===== 赤（体力回復ベース） =====
    - id: red
      name: "赤"
      base:
        trigger: lesson_end
        max_count: 2
        effects: {}
        description: "レッスン終了時、体力回復6"
      plushes:
        - id: kuma
          name: "くま"
          trigger: lesson_end
          max_count: 2
          effects: { p_drink_acquire: 1 }
          description: "レッスン終了時、体力回復6・ランダムなPドリンクを獲得"
          decorations:
            - { id: flower,  name: "花",   trigger: lesson_end, max_count: 2, effects: { p_drink_acquire: 1 }, description: "レッスン終了時、体力回復6・Pドリンクを選択して獲得" }
            - { id: ribbon,  name: "リボン", trigger: lesson_end, max_count: 2, effects: { p_drink_acquire: 1, skill_change: 1 }, description: "レッスン終了時、体力回復6・ランダムなPドリンクを獲得・スキルカードをセレクトチェンジ" }
            - { id: feather, name: "羽",   trigger: lesson_end, max_count: 1, effects: { p_drink_acquire: 1, skill_ssr_acquire: 1 }, description: "レッスン終了時、体力回復12・ランダムなPドリンクを獲得・スキルカード（高確率でSSR）を選択して獲得" }
        - id: ningyo
          name: "人形"
          trigger: consultation
          max_count: 1
          effects: {}
          description: "相談選択時、体力回復12・Pポイント+40"
          decorations:
            - { id: flower,  name: "花",   trigger: consultation, max_count: 1, effects: {}, description: "相談選択時、体力回復12・Pポイント+40・相談のPドリンクを50%割引" }
            - { id: ribbon,  name: "リボン", trigger: consultation, max_count: 1, effects: {}, description: "相談選択時、体力回復12・Pポイント+40・相談のスキルカード強化を50%割引" }
            - { id: medal,   name: "メダル", trigger: consultation, max_count: 1, effects: {}, description: "相談選択時、体力回復12・Pポイント+40・相談のスキルカード削除を50%割引" }
            - { id: feather, name: "羽",   trigger: consultation, max_count: 1, effects: {}, description: "相談選択時、体力回復12・Pポイント+20・相談のスキルカードを50%割引" }
        - id: robo
          name: "ロボ"
          trigger: activity_supply
          max_count: 1
          effects: { skill_change: 1 }
          description: "差し入れ終了時、体力回復12・スキルカードをセレクトチェンジ"
          decorations:
            - { id: flower,  name: "花",   trigger: activity_supply, max_count: 1, effects: { skill_change: 1 }, description: "差し入れ終了時、体力回復12・スキルカードを（高確率でSSR）にセレクトチェンジ" }
            - { id: ribbon,  name: "リボン", trigger: activity_supply, max_count: 1, effects: { skill_ssr_acquire: 1 }, description: "差し入れ終了時、体力回復12・スキルカード（高確率でSSR）を選択して獲得" }
            - { id: medal,   name: "メダル", trigger: activity_supply, max_count: 1, effects: { skill_change: 1 }, description: "差し入れ終了時、体力回復6・スキルカード（トラブル含む）を（高確率でSSR）にセレクトチェンジ" }
            - { id: feather, name: "羽",   trigger: activity_supply, max_count: 1, effects: { skill_ssr_acquire: 1 }, description: "差し入れ終了時、体力回復6・強化済みのスキルカード（高確率でSSR）を選択して獲得" }
        - id: moja
          name: "もじゃ"
          trigger: outing_end
          max_count: 1
          effects: { skill_enhance: 1 }
          description: "おでかけ終了時、体力回復6・ランダムなスキルカードを強化"
          decorations:
            - { id: flower,  name: "花",   trigger: outing_end, max_count: 1, effects: { skill_change: 1 }, description: "おでかけ終了時、体力回復6・スキルカードを選択してセレクトチェンジ" }
            - { id: ribbon,  name: "リボン", trigger: outing_end, max_count: 1, effects: { skill_ssr_acquire: 1 }, description: "おでかけ終了時、体力回復6・スキルカードを選択してコピー（獲得扱い）" }
            - { id: medal,   name: "メダル", trigger: outing_end, max_count: 1, effects: { skill_enhance: 1 }, description: "おでかけ終了時、体力回復6・スキルカードを選択して強化" }
            - { id: feather, name: "羽",   trigger: outing_end, max_count: 1, effects: { skill_delete: 1 }, description: "おでかけ終了時、体力回復6・スキルカードを選択して削除" }

    # ===== 緑（Pポイントベース） =====
    - id: green
      name: "緑"
      base:
        trigger: lesson_end
        max_count: 2
        effects: {}
