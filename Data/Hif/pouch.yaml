          description: "おでかけ終了時、Pポイント+60・ランダムなスキルカードを強化"
          decorations:
            - { id: flower,  name: "花",   trigger: outing_end, max_count: 1, effects: { skill_change: 1 }, description: "おでかけ終了時、Pポイント+60・スキルカードを選択してセレクトチェンジ" }
            - { id: ribbon,  name: "リボン", trigger: outing_end, max_count: 1, effects: { skill_ssr_acquire: 1 }, description: "おでかけ終了時、Pポイント+60・スキルカードを選択してコピー（獲得扱い）" }
            - { id: medal,   name: "メダル", trigger: outing_end, max_count: 1, effects: { skill_enhance: 1 }, description: "おでかけ終了時、Pポイント+60・スキルカードを選択して強化" }
            - { id: feather, name: "羽",   trigger: outing_end, max_count: 1, effects: { skill_delete: 1 }, description: "おでかけ終了時、Pポイント+60・スキルカードを選択して削除" }
        - id: inko
