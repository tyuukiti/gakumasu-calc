            - { id: ribbon,  name: "リボン", trigger: activity_supply, max_count: 1, effects: { skill_ssr_acquire: 1 }, description: "差し入れ終了時、Pポイント+60・スキルカード（高確率でSSR）を選択して獲得" }
            - { id: medal,   name: "メダル", trigger: activity_supply, max_count: 1, effects: { skill_change: 1 }, description: "差し入れ終了時、Pポイント+30・スキルカード（トラブル含む）を（高確率でSSR）にセレクトチェンジ" }
            - { id: feather, name: "羽",   trigger: activity_supply, max_count: 1, effects: { skill_ssr_acquire: 1 }, description: "差し入れ終了時、Pポイント+30・強化済みのスキルカード（高確率でSSR）を選択して獲得" }
        - id: ningyo
