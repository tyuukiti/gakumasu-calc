          description: "レッスン終了時、Pポイント+30・ランダムなPドリンクを獲得"
          decorations:
            - { id: flower,  name: "花",   trigger: lesson_end, max_count: 2, effects: { p_drink_acquire: 1 }, description: "レッスン終了時、Pポイント+30・Pドリンクを選択して獲得" }
            - { id: ribbon,  name: "リボン", trigger: lesson_end, max_count: 2, effects: { p_drink_acquire: 1, skill_change: 1 }, description: "レッスン終了時、Pポイント+30・ランダムなPドリンクを獲得・スキルカードをセレクトチェンジ" }
            - { id: feather, name: "羽",   trigger: lesson_end, max_count: 1, effects: { p_drink_acquire: 1, skill_ssr_acquire: 1 }, description: "レッスン終了時、Pポイント+60・ランダムなPドリンクを獲得・スキルカード（高確率でSSR）を選択して獲得" }
        - id: usagi
          name: "うさぎ"
          trigger: consultation
          max_count: 1
          effects: {}
          description: "相談選択時、Pポイント+100"
          decorations:
            - { id: flower,  name: "花",   trigger: consultation, max_count: 1, effects: {}, description: "相談選択時、Pポイント+60・相談のPドリンクを50%割引" }
            - { id: ribbon,  name: "リボン", trigger: consultation, max_count: 1, effects: {}, description: "相談選択時、Pポイント+100・相談のスキルカード強化を50%割引" }
